# AI Monitor config — แก้ได้เลย ไม่มีความลับในไฟล์นี้ (API key อยู่ใน .env)
host: 127.0.0.1
port: 8765
db_path: ai-monitor.db
retention_days: 30

defaults:
  interval_s: 60            # เช็คทุกกี่วินาที
  timeout_s: 15
  degraded_latency_ms: 5000 # ช้ากว่านี้ = สีเหลือง
  fail_threshold: 2         # ล้มกี่ครั้งติดกันถึงขึ้นสีแดง

# Hermes Router: แสดงผลการตัดสินใจล่าสุด (อ่านอย่างเดียว ไม่แก้ logic การ route)
# ไม่ตั้งค่า = หาไฟล์ router*.json / router*.jsonl ใน Hermes home ให้เอง ถ้าไม่เจอจะแสดง ROUTER: N/A
router:
  auto_discover: true
  # file: "%LOCALAPPDATA%\\hermes\\logs\\router.jsonl"   # JSON หรือ JSON-lines (บรรทัดล่าสุด = การตัดสินใจล่าสุด)
  # log: "%LOCALAPPDATA%\\hermes\\logs\\agent.log"        # log ข้อความธรรมดา + pattern ด้านล่าง
  # pattern: 'route=(?P<route>\w+) model=(?P<model>\S+) reason="(?P<reason>[^"]*)" status=(?P<status>\w+)'
  # url: http://127.0.0.1:9000/router/last                  # endpoint ที่คืน JSON
  # fields: {model: "target.name"}                          # ถ้าชื่อ field ไม่ตรงค่ามาตรฐาน

providers:
  - id: hermes
    name: Hermes Agent
    type: hermes
    interval_s: 15
    home: auto              # auto = %LOCALAPPDATA%\hermes (Windows) หรือ ~/.hermes
    gateway_required: true  # ถ้าใช้แต่ CLI ไม่ได้เปิด gateway ให้ตั้งเป็น false

  # ChatGPT / Claude ใช้แบบ subscription: สถานะจาก status page ทางการ + แถบโควตา (ไม่เสีย token)
  - id: chatgpt
    name: ChatGPT
    group: Cloud
    type: status_page
    url: https://status.openai.com/api/v2/summary.json
    component: ChatGPT
    usage: codex              # แถบโควตา 5 ชม./สัปดาห์ จากการล็อกอิน Codex CLI (ลบบรรทัดนี้ถ้าไม่ใช้)

  - id: claude
    name: Claude
    group: Cloud
    type: status_page
    url: https://status.anthropic.com/api/v2/summary.json
    component: claude.ai
    usage: claude_code        # แถบโควตา 5 ชม./สัปดาห์ จากการล็อกอิน Claude Code (ลบบรรทัดนี้ถ้าไม่ใช้)

  # model_hint = คำที่อยู่ในชื่อโมเดล ระบบจะหาชื่อจริงจาก /models ให้เอง
  - id: mimo
    name: MiMo
    group: Cloud
    type: openai_compat
    # Token Plan (key ขึ้นต้น tp-): ใช้ "Dedicated Base URL" จากหน้า Plan usage ของ MiMo
    # จ่ายตามการใช้ (key ปกติ): https://api.xiaomimimo.com/v1
    base_url: https://token-plan-sgp.xiaomimimo.com/v1
    api_key_env: MIMO_API_KEY
    interval_s: 300           # แพ็กเกจนี้สำหรับใช้งานแบบโต้ตอบ: เช็คแค่รายชื่อโมเดลทุก 5 นาที ไม่ส่ง prompt
    # auth_header: api-key    # ถ้า MiMo ต้องส่ง key ใน header "api-key" แทน "Authorization: Bearer"
    model_hint: mimo

  - id: glm
    name: Z.ai GLM Flash
    group: Free
    type: openai_compat
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY
    model_hint: flash

  - id: nemotron
    name: Nemotron 3
    group: Free
    type: openai_compat
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    model_hint: nemotron
    # probe: true             # เปิดถ้าอยากยิง prompt จริง 1 token เพื่อวัด latency
    # probe_interval_s: 1800

  - id: sparkx
    name: Sparkx 2.5
    group: Local
    type: ollama
    base_url: auto            # auto = ใช้ OLLAMA_HOST ถ้าตั้งไว้ ไม่งั้น http://127.0.0.1:11434
    auto_start: true          # Ollama ไม่ได้รัน -> เปิด `ollama serve` ให้เองแบบซ่อนหน้าต่าง
    model_hint: spark         # แก้ให้ตรงกับชื่อใน `ollama list`
    # speed_probe: false      # ปิดการวัด tokens/sec (วัดเฉพาะตอนโมเดลโหลดอยู่แล้ว ทุก 10 นาที, 16 tokens)

  - id: qwen
    name: Qwen 3.5
    group: Local
    type: ollama
    base_url: auto
    auto_start: true
    model_hint: qwen3.5

  - id: gpu
    name: GPU
    group: Local
    type: gpu
    interval_s: 10
    temp_warn_c: 80           # เหลือง
    temp_crit_c: 90           # แดง
    vram_warn_pct: 95
