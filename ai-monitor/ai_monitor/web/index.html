<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span><div><b>AI MONITOR</b><small>NEURAL SYSTEMS STATUS</small></div></div>
    <div id="summary" class="summary"></div>
    <div id="ticker" class="ticker"></div>
    <div class="timebox"><span id="clock" class="clock">--:--:--</span><small id="date"></small><span id="link" class="link"></span></div>
  </header>
  <main class="layout">
    <section id="hermes" class="card hermes s-unknown"></section>
    <section id="grid" class="grid"></section>
  </main>
  <div id="modal" class="modal" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
