<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; media-src 'self' file:">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Clinic Sign</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Admin exit: hold the top-left corner for 5 seconds (or Ctrl+Shift+Q). -->
  <div id="corner" aria-hidden="true"></div>

  <main id="saver" class="page" hidden>
    <video id="saver-video" class="fill" muted loop playsinline preload="auto" hidden></video>
    <img id="saver-img" class="fill" alt="" draggable="false" hidden>
    <p class="saver-hint">แตะเพื่อเริ่ม</p>
  </main>

  <main id="home" class="page">
    <video id="bg-video" class="fill bg-video" muted loop playsinline preload="auto" hidden></video>
    <header class="search-bar">
      <div class="search-row">
      <label class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="text" placeholder="ค้นหาชื่อคลินิก" inputmode="none" virtualkeyboardpolicy="manual" autocomplete="off" spellcheck="false">
        <button id="search-clear" type="button" class="icon-btn" aria-label="ล้างคำค้นหา" hidden>✕</button>
      </label>
      <button id="to-saver" type="button" class="round-btn" aria-label="พักหน้าจอ" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
      </div>
      <p id="count" class="count"></p>
    </header>
    <section id="grid" class="grid"></section>
    <p id="empty" class="empty" hidden></p>
    <div id="keyboard" class="keyboard" hidden></div>
  </main>

  <main id="sign" class="page" hidden>
    <div class="sign-logo">
      <img id="sign-img" alt="" draggable="false">
    </div>
    <div class="pad">
      <p id="pad-hint" class="pad-hint">เซ็นชื่อในกรอบนี้</p>
      <div class="pad-line"></div>
      <canvas id="pad"></canvas>
    </div>
    <div class="actions">
      <button id="btn-clear" type="button" class="btn btn-clear" aria-label="ลบ">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        <span class="txt">ลบ</span>
      </button>
      <button id="btn-back" type="button" class="btn btn-back" aria-label="กลับ">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span class="txt">กลับ</span>
      </button>
    </div>
  </main>

  <script src="logic.js"></script>
  <script src="keyboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
